<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sıla ❤️ Berke</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #030004;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fff;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Sol Üst - Sıla ❤️ Berke */
        .left-top-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 46, 99, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffb3c1;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            letter-spacing: 1px;
        }

        /* Sağ Üst - Müzik Kutusu */
        .top-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 46, 99, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #ffb3c1;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
            transition: all 0.3s ease;
        }
        .top-badge:hover {
            background: rgba(255, 46, 99, 0.25);
            transform: scale(1.05);
        }
        .music-icon {
            animation: spin 4s linear infinite;
        }

        /* Ekran Ortası - İsim ve Kart */
        .content-box {
            position: relative;
            z-index: 2;
            text-align: center;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 15px;
            width: 100%;
        }
        .center-title {
            font-size: clamp(2.8rem, 8vw, 5rem);
            font-weight: 900;
            letter-spacing: 6px;
            color: #ff2e63;
            text-shadow: 0 0 25px #ff0055, 0 0 50px #ff0055, 0 0 80px #ff0055;
            margin-bottom: 2px;
            text-transform: uppercase;
        }
        .subtitle {
            font-size: clamp(0.85rem, 3vw, 1.15rem);
            color: #ffc2d1;
            letter-spacing: 2px;
            opacity: 0.95;
            margin-bottom: 20px;
            font-style: italic;
        }
        .message-card {
            background: rgba(10, 0, 8, 0.75);
            border: 1px solid rgba(255, 46, 99, 0.45);
            padding: 14px 22px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.35);
            max-width: 90%;
            width: 480px;
        }
        .message-card p {
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            color: #ffe6ea;
            line-height: 1.5;
            font-weight: 300;
        }
        .message-card span {
            display: block;
            margin-top: 8px;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            color: #ff4d6d;
            font-weight: 600;
        }

        /* Bilgisayar ekranları için rozet boyutları */
        @media (min-width: 768px) {
            .left-top-badge {
                top: 25px;
                left: 25px;
                font-size: 1.15rem;
                padding: 10px 22px;
            }
            .top-badge {
                top: 25px;
                right: 25px;
                font-size: 0.9rem;
                padding: 10px 20px;
            }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="left-top-badge">
        Sıla ❤️ Berke
    </div>

    <div class="top-badge" id="musicBtn">
        <span class="music-icon">🎵</span>
        <span id="musicText">Çalmak İçin Tıkla</span>
    </div>

    <canvas id="heartCanvas"></canvas>

    <div class="content-box">
        <h1 class="center-title">SILA</h1>
        <div class="subtitle">Sen Benim En Güzel Hikayemsin</div>

        <div class="message-card">
            <p>"Herkes çiçek alır... Ben senin için dünyadaki en güzel kalbi kodladım."</p>
            <span>✨ İyi Ki Varsın Sıla ✨</span>
        </div>
    </div>

    <audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-ambient-111554.mp3"></audio>

    <script>
        // Müzik Kontrolü
        const audio = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const musicText = document.getElementById('musicText');
        let isPlaying = false;

        musicBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                musicText.textContent = "Müziği Başlat 🎵";
            } else {
                audio.play();
                musicText.textContent = "Sıla İçin Çalıyor 🎶";
            }
            isPlaying = !isPlaying;
        });

        // Tuval ve Kalp Boyutlandırma
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // SADECE İSTEDİĞİN KELİMELER
        const words = [
            "Meleğim", 
            "Ömrüm", 
            "Güzelim", 
            "Seni Seviyorum", 
            "Sıla"
        ];

        function heartEquation(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return {
                x: x * scale,
                y: y * scale
            };
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.t = Math.random() * Math.PI * 2;
                this.speed = 0.004 + Math.random() * 0.008;
                
                // Telefon veya bilgisayar ekran genişliğine göre kalp ölçeği
                const minDim = Math.min(width, height);
                const baseScale = minDim / 42; 
                this.scale = baseScale + Math.random() * (baseScale * 0.25);

                this.isText = Math.random() < 0.45; // %45 metin parçacığı
                this.text = words[Math.floor(Math.random() * words.length)];
                
                // Ekran küçüldükçe yazı boyutunu otomatik ayarla
                const fontBase = minDim < 600 ? 10 : 13;
                this.fontSize = Math.floor(Math.random() * 6) + fontBase;
                this.opacity = Math.random() * 0.85 + 0.15;
            }

            update(beatScale) {
                this.t += this.speed;
                const pos = heartEquation(this.t, this.scale * beatScale);
                this.x = width / 2 + pos.x;
                this.y = height / 2 - (height < 600 ? 15 : 30) + pos.y;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                if (this.isText) {
                    ctx.font = `bold ${this.fontSize}px 'Segoe UI', sans-serif`;
                    ctx.fillStyle = '#ff3366';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ff0055';
                    ctx.fillText(this.text, this.x, this.y);
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, width < 600 ? 1.3 : 1.8, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff1a53';
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#ff0055';
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // Parçacık Sayısı
        let particleCount = window.innerWidth < 600 ? 450 : 700;
        let particles = [];
        
        function initParticles() {
            particles = [];
            particleCount = window.innerWidth < 600 ? 450 : 700;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        });

        initParticles();

        let time = 0;
        function animate() {
            ctx.fillStyle = 'rgba(3, 0, 4, 0.22)';
            ctx.fillRect(0, 0, width, height);

            time += 0.045;
            const beatScale = 1 + Math.sin(time * 2.2) * 0.10 + Math.pow(Math.sin(time * 4.4), 2) * 0.05;

            particles.forEach(p => {
                p.update(beatScale);
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
