<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Sıla ❤️ Berke</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 46%,
                    rgba(75, 0, 28, 0.28) 0%,
                    rgba(25, 0, 12, 0.16) 32%,
                    #020003 68%
                );

            color: white;
            font-family:
                "Segoe UI",
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;
        }

        /* =========================
           CANVAS
        ========================= */

        #heartCanvas {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 1;
        }

        /* =========================
           ÜST SOL
        ========================= */

        .left-top-badge {
            position: fixed;

            top: 20px;
            left: 20px;

            z-index: 20;

            display: flex;
            align-items: center;
            gap: 8px;

            padding: 10px 20px;

            border-radius: 999px;

            background: rgba(16, 5, 12, 0.55);

            border: 1px solid rgba(255, 45, 95, 0.55);

            backdrop-filter: blur(16px);

            color: #ffd1dc;

            font-size: 15px;
            font-weight: 700;

            letter-spacing: 1.2px;

            box-shadow:
                0 0 12px rgba(255, 0, 75, 0.22),
                inset 0 0 15px rgba(255, 255, 255, 0.025);
        }

        .badge-heart {
            color: #ff174f;

            text-shadow:
                0 0 7px #ff174f,
                0 0 15px rgba(255, 23, 79, 0.8);

            animation: smallHeartBeat 1.15s infinite;
        }

        /* =========================
           MÜZİK BUTONU
        ========================= */

        .music-button {
            position: fixed;

            top: 20px;
            right: 20px;

            z-index: 20;

            display: flex;
            align-items: center;
            gap: 9px;

            padding: 10px 20px;

            border-radius: 999px;

            border: 1px solid rgba(255, 45, 95, 0.45);

            background: rgba(16, 5, 12, 0.55);

            backdrop-filter: blur(16px);

            color: #ffd1dc;

            font-size: 14px;

            cursor: pointer;

            user-select: none;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;

            box-shadow:
                0 0 12px rgba(255, 0, 75, 0.18),
                inset 0 0 15px rgba(255, 255, 255, 0.025);
        }

        .music-button:hover {
            transform: scale(1.04);

            background: rgba(65, 8, 28, 0.75);

            box-shadow:
                0 0 18px rgba(255, 0, 75, 0.32);
        }

        .music-icon {
            color: #ff3867;

            text-shadow:
                0 0 10px #ff174f;

            animation: musicFloat 1.4s ease-in-out infinite;
        }

        /* YouTube oynatıcı görünmez; sadece ses için kullanılır */
        #youtubePlayer {
            position: fixed;
            left: -9999px;
            top: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            z-index: -1;
        }

        /* =========================
           ORTA İÇERİK
        ========================= */

        .content {
            position: fixed;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -46%);

            z-index: 10;

            width: min(92vw, 620px);

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            pointer-events: none;
        }

        .main-name {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(60px, 7.5vw, 108px);

            font-weight: 500;

            line-height: 0.92;

            letter-spacing: 8px;

            color: #ff416d;

            text-shadow:
                0 0 5px rgba(255, 255, 255, 0.85),
                0 0 12px #ff174f,
                0 0 28px #ff0048,
                0 0 55px rgba(255, 0, 64, 0.8);

            animation: titlePulse 1.15s infinite;
        }

        .subtitle {
            margin-top: 14px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(14px, 1.7vw, 20px);

            font-style: italic;

            letter-spacing: 4px;

            color: rgba(255, 228, 235, 0.94);

            text-shadow:
                0 0 12px rgba(255, 78, 120, 0.52);
        }

        /* =========================
           MESAJ KARTI
        ========================= */

        .message-card {
            position: relative;

            margin-top: 22px;

            width: min(92vw, 530px);

            padding: 20px 28px 17px;

            border-radius: 18px;

            background:
                linear-gradient(
                    180deg,
                    rgba(26, 4, 15, 0.90),
                    rgba(9, 1, 7, 0.86)
                );

            border: 1px solid rgba(255, 42, 91, 0.55);

            backdrop-filter: blur(20px);

            box-shadow:
                0 0 28px rgba(255, 0, 68, 0.20),
                inset 0 0 25px rgba(255, 255, 255, 0.02);
        }

        .message {
            font-size: clamp(14px, 1.45vw, 18px);

            line-height: 1.55;

            font-weight: 300;

            color: #ffe8ee;
        }

        .divider {
            display: flex;
            align-items: center;

            width: 76%;

            margin: 13px auto 7px;

            gap: 10px;
        }

        .divider::before,
        .divider::after {
            content: "";

            height: 1px;

            flex: 1;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 40, 90, 0.7)
                );
        }

        .divider::after {
            background:
                linear-gradient(
                    90deg,
                    rgba(255, 40, 90, 0.7),
                    transparent
                );
        }

        .divider-heart {
            color: #ff315f;

            font-size: 17px;

            text-shadow:
                0 0 7px #ff174f,
                0 0 17px #ff174f;

            animation: smallHeartBeat 1.15s infinite;
        }

        .final-message {
            font-size: clamp(13px, 1.35vw, 16px);

            font-weight: 600;

            color: #ff6083;

            text-shadow:
                0 0 10px rgba(255, 42, 91, 0.5);
        }

        /* =========================
           ANİMASYONLAR
        ========================= */

        @keyframes smallHeartBeat {

            0%,
            100% {
                transform: scale(1);
            }

            8% {
                transform: scale(1.3);
            }

            15% {
                transform: scale(1);
            }

            23% {
                transform: scale(1.18);
            }

            31% {
                transform: scale(1);
            }
        }

        @keyframes titlePulse {

            0%,
            100% {
                transform: scale(1);
                filter: brightness(1);
            }

            8% {
                transform: scale(1.035);
                filter: brightness(1.18);
            }

            15% {
                transform: scale(1);
            }

            23% {
                transform: scale(1.018);
            }

            31% {
                transform: scale(1);
            }
        }

        @keyframes musicFloat {

            0%,
            100% {
                transform: translateY(0) rotate(-7deg);
            }

            50% {
                transform: translateY(-3px) rotate(8deg);
            }
        }

        /* =========================
           MOBİL
        ========================= */

        @media (max-width: 650px) {

            .left-top-badge {
                top: 12px;
                left: 12px;

                padding: 8px 13px;

                font-size: 12px;
            }

            .music-button {
                top: 12px;
                right: 12px;

                padding: 8px 12px;

                font-size: 11px;
            }

            .content {
                transform: translate(-50%, -43%);
            }

            .main-name {
                letter-spacing: 5px;
            }

            .subtitle {
                margin-top: 10px;

                letter-spacing: 2px;
            }

            .message-card {
                margin-top: 15px;

                padding: 15px 18px;
            }
        }

    </style>
</head>

<body>

    <!-- =========================
         ÜST SOL
    ========================== -->

    <div class="left-top-badge">
        <span id="coupleText">Sıla</span>

        <span class="badge-heart">♥</span>

        <span>Berke</span>
    </div>


    <!-- =========================
         MÜZİK
    ========================== -->

    <div class="music-button" id="musicButton">

        <span class="music-icon">♫</span>

        <span id="musicText">
            Çalmak İçin Tıkla
        </span>

    </div>


    <!-- =========================
         KALP CANVAS
    ========================== -->

    <canvas id="heartCanvas"></canvas>


    <!-- =========================
         ORTA İÇERİK
    ========================== -->

    <main class="content">

        <div
            class="main-name"
            id="mainName"
        >
            SILA
        </div>


        <div class="subtitle">
            Sen Benim En Güzel Hikayemsin
        </div>


        <div class="message-card">

            <div class="message">

                “Herkes çiçek alır...
                Ben senin için dünyadaki
                en güzel kalbi kodladım.”

            </div>


            <div class="divider">

                <span class="divider-heart">
                    ♥
                </span>

            </div>


            <div class="final-message">

                ✨ İyi Ki Varsın Sıla ✨

            </div>

        </div>

    </main>


    <!-- =========================
         MÜZİK
    ========================== -->

    <!-- YouTube şarkısı: https://www.youtube.com/watch?v=66A_3uwuZ_I -->
    <div id="youtubePlayer" aria-hidden="true"></div>
    <script src="https://www.youtube.com/iframe_api"></script>


    <script>

        /* =====================================================
           AYARLAR
           SADECE BURAYI DEĞİŞTİRMEN YETERLİ
        ===================================================== */

        const CONFIG = {

            mainName: "SILA",

            words: [
                "Sıla",
                "Meleğim",
                "Ömrüm",
                "Güzelim",
                "Seni Seviyorum",
                "Her Şeyim",
                "Bir Tanem"
            ],

            colors: [
                "#ff174f",
                "#ff2d60",
                "#ff416d",
                "#ff6685",
                "#ff8aa0"
            ]

        };


        /* =====================================================
           YOUTUBE MÜZİK
        ===================================================== */

        const YOUTUBE_VIDEO_ID = "66A_3uwuZ_I";

        const musicButton =
            document.getElementById("musicButton");

        const musicText =
            document.getElementById("musicText");

        let youtubePlayer = null;
        let playerReady = false;
        let musicPlaying = false;

        // YouTube IFrame API bu fonksiyonu otomatik çağırır.
        window.onYouTubeIframeAPIReady = function () {

            youtubePlayer = new YT.Player(
                "youtubePlayer",
                {
                    width: "1",
                    height: "1",
                    videoId: YOUTUBE_VIDEO_ID,

                    playerVars: {
                        controls: 0,
                        disablekb: 1,
                        playsinline: 1,
                        rel: 0,
                        loop: 1,
                        playlist: YOUTUBE_VIDEO_ID
                    },

                    events: {
                        onReady: function (event) {
                            playerReady = true;
                            event.target.setVolume(70);
                            musicText.textContent = "Çalmak İçin Tıkla";
                        },

                        onStateChange: function (event) {
                            if (event.data === YT.PlayerState.PLAYING) {
                                musicPlaying = true;
                                musicText.textContent = "Sıla İçin Çalıyor ♫";
                            }

                            if (event.data === YT.PlayerState.PAUSED) {
                                musicPlaying = false;
                                musicText.textContent = "Çalmak İçin Tıkla";
                            }

                            if (event.data === YT.PlayerState.ENDED) {
                                youtubePlayer.seekTo(0, true);
                                youtubePlayer.playVideo();
                            }
                        },

                        onError: function () {
                            musicPlaying = false;
                            musicText.textContent = "Şarkı açılamadı";
                        }
                    }
                }
            );
        };

        musicText.textContent = "Müzik yükleniyor...";

        musicButton.addEventListener(
            "click",
            () => {
                if (!playerReady || !youtubePlayer) {
                    musicText.textContent = "Müzik yükleniyor...";
                    return;
                }

                if (musicPlaying) {
                    youtubePlayer.pauseVideo();
                } else {
                    youtubePlayer.playVideo();
                }
            }
        );


        /* =====================================================
           CANVAS
        ===================================================== */

        const canvas =
            document.getElementById("heartCanvas");

        const ctx =
            canvas.getContext("2d");


        let width = 0;

        let height = 0;

        let dpr = 1;


        function resizeCanvas() {

            dpr =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );


            width =
                window.innerWidth;


            height =
                window.innerHeight;


            canvas.width =
                width * dpr;


            canvas.height =
                height * dpr;


            canvas.style.width =
                width + "px";


            canvas.style.height =
                height + "px";


            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );

        }


        resizeCanvas();


        window.addEventListener(
            "resize",
            () => {

                resizeCanvas();

                createWordParticles();

                createBackgroundParticles();

            }
        );


        /* =====================================================
           HEART MATEMATİĞİ
        ===================================================== */

        function heartPoint(
            angle,
            scale
        ) {

            const x =
                16 *
                Math.pow(
                    Math.sin(angle),
                    3
                );


            const y =
                13 * Math.cos(angle)

                - 5 * Math.cos(2 * angle)

                - 2 * Math.cos(3 * angle)

                - Math.cos(4 * angle);


            return {

                x: x * scale,

                y: -y * scale

            };

        }


        /* =====================================================
           KALP ATIŞI
           İKİLİ "DUM-DUM" EFFECT
        ===================================================== */

        function gaussian(
            x,
            center,
            widthValue
        ) {

            const d =
                (x - center) /
                widthValue;


            return Math.exp(
                -(d * d)
            );

        }


        function getHeartbeat(
            currentTime
        ) {

            /*
                1.15 saniyede bir atış
                İlk kuvvetli vuruş
                Ardından daha küçük ikinci vuruş
            */

            const cycle =
                1.15;


            const phase =
                (currentTime % cycle) /
                cycle;


            const firstBeat =
                gaussian(
                    phase,
                    0.08,
                    0.035
                );


            const secondBeat =
                gaussian(
                    phase,
                    0.22,
                    0.045
                );


            return (
                1
                +
                firstBeat * 0.075
                +
                secondBeat * 0.038
            );

        }


        /* =====================================================
           WORD PARTICLES
        ===================================================== */

        let wordParticles = [];


        class WordParticle {

            constructor() {

                this.reset(true);

            }


            reset(firstLoad = false) {

                /*
                    Kalbin çevresinde hangi noktada
                    doğacağı
                */

                this.angle =
                    Math.random() *
                    Math.PI *
                    2;


                /*
                    Kelimenin kalp üzerinde
                    hafifçe kayması
                */

                this.angleSpeed =
                    (
                        0.018
                        +
                        Math.random() *
                        0.028
                    )
                    *
                    (
                        Math.random() >
                        0.5
                        ? 1
                        : -1
                    );


                /*
                    progress = 0 dış taraf
                    progress = 1 iç taraf
                */

                this.progress =
                    firstLoad
                        ? Math.random()
                        : 0;


                /*
                    DIŞTAN İÇE AKMA HIZI
                */

                this.inwardSpeed =
                    0.11
                    +
                    Math.random() *
                    0.11;


                this.word =
                    CONFIG.words[
                        Math.floor(
                            Math.random() *
                            CONFIG.words.length
                        )
                    ];


                this.color =
                    CONFIG.colors[
                        Math.floor(
                            Math.random() *
                            CONFIG.colors.length
                        )
                    ];


                this.baseAlpha =
                    0.38
                    +
                    Math.random() *
                    0.62;


                this.fontBoost =
                    Math.random();


                this.offset =
                    (
                        Math.random() -
                        0.5
                    )
                    * 0.055;


                this.rotation =
                    (
                        Math.random() -
                        0.5
                    )
                    * 0.09;

            }


            update(delta) {

                this.progress +=
                    this.inwardSpeed *
                    delta;


                this.angle +=
                    this.angleSpeed *
                    delta;


                if (
                    this.progress >= 1
                ) {

                    this.reset(false);

                }

            }


            getPosition(
                progressValue,
                heartbeatScale
            ) {

                /*
                    0.00 = dış kalp
                    1.00 = kalbin daha iç tarafı

                    Böylece kelimeler kalbin dışından
                    merkeze doğru akıyor.
                */

                const outerRadius =
                    1.19;


                const innerRadius =
                    0.60;


                const radius =
                    outerRadius
                    -
                    (
                        outerRadius -
                        innerRadius
                    )
                    *
                    progressValue;


                /*
                    Hafif easing:
                    sona yaklaştıkça içeri doğru
                    daha hızlı çekiliyormuş gibi.
                */

                const easedRadius =
                    radius
                    -
                    Math.pow(
                        progressValue,
                        2
                    )
                    * 0.05;


                const minDim =
                    Math.min(
                        width,
                        height
                    );


                /*
                    Desktop / mobile uyumu
                */

                const scale =
                    minDim /
                    (
                        width < 700
                            ? 35
                            : 33
                    );


                const p =
                    heartPoint(
                        this.angle,
                        scale *
                        easedRadius *
                        heartbeatScale
                    );


                const centerX =
                    width / 2;


                const centerY =
                    height / 2
                    -
                    (
                        width < 700
                            ? 15
                            : 35
                    );


                return {

                    x:
                        centerX +
                        p.x,

                    y:
                        centerY +
                        p.y

                };

            }


            draw(
                heartbeatScale
            ) {

                const progress =
                    this.progress;


                const position =
                    this.getPosition(
                        progress,
                        heartbeatScale
                    );


                /*
                    Kelime içeri girdikçe küçülüyor
                */

                const sizeFactor =
                    1 -
                    progress *
                    0.52;


                const minDim =
                    Math.min(
                        width,
                        height
                    );


                const baseFont =
                    minDim < 620
                        ? 9
                        : 11;


                const fontSize =
                    baseFont
                    +
                    this.fontBoost * 10;


                /*
                    Ortaya yaklaşınca yavaşça
                    kayboluyor.
                */

                let fade =
                    1;


                if (
                    progress >
                    0.72
                ) {

                    fade =
                        1
                        -
                        (
                            progress -
                            0.72
                        )
                        /
                        0.28;

                }


                /*
                    TRAIL
                    Kelimenin arkasında birkaç
                    kopya çiziyoruz.
                    Böylece içeri akıyormuş hissi.
                */

                const trailCount =
                    width < 650
                        ? 2
                        : 4;


                for (
                    let i = trailCount;
                    i >= 1;
                    i--
                ) {

                    const trailProgress =
                        Math.max(
                            0,
                            progress -
                            i * 0.025
                        );


                    const trailPosition =
                        this.getPosition(
                            trailProgress,
                            heartbeatScale
                        );


                    ctx.save();


                    ctx.translate(
                        trailPosition.x,
                        trailPosition.y
                    );


                    ctx.rotate(
                        this.rotation
                    );


                    ctx.globalAlpha =
                        this.baseAlpha
                        *
                        fade
                        *
                        (
                            0.055 *
                            (
                                trailCount -
                                i +
                                1
                            )
                        );


                    ctx.font =
                        `600 ${
                            fontSize *
                            sizeFactor
                        }px "Segoe UI", sans-serif`;


                    ctx.textAlign =
                        "center";


                    ctx.textBaseline =
                        "middle";


                    ctx.fillStyle =
                        this.color;


                    ctx.shadowBlur =
                        12;


                    ctx.shadowColor =
                        "#ff174f";


                    ctx.fillText(
                        this.word,
                        0,
                        0
                    );


                    ctx.restore();

                }


                /*
                    ANA KELİME
                */

                ctx.save();


                ctx.translate(
                    position.x,
                    position.y
                );


                ctx.rotate(
                    this.rotation
                );


                ctx.globalAlpha =
                    this.baseAlpha *
                    fade;


                ctx.font =
                    `600 ${
                        fontSize *
                        sizeFactor
                    }px "Segoe UI", sans-serif`;


                ctx.textAlign =
                    "center";


                ctx.textBaseline =
                    "middle";


                ctx.fillStyle =
                    this.color;


                ctx.shadowBlur =
                    7
                    +
                    (
                        1 -
                        progress
                    )
                    * 8;


                ctx.shadowColor =
                    "#ff0048";


                ctx.fillText(
                    this.word,
                    0,
                    0
                );


                ctx.restore();

            }

        }


        function createWordParticles() {

            wordParticles = [];


            /*
                Desktop'ta daha fazla kelime.
            */

            let count;


            if (
                width < 500
            ) {

                count = 180;

            }
            else if (
                width < 900
            ) {

                count = 270;

            }
            else {

                count = 430;

            }


            for (
                let i = 0;
                i < count;
                i++
            ) {

                wordParticles.push(
                    new WordParticle()
                );

            }

        }


        createWordParticles();


        /* =====================================================
           KALBİN SABİT NEON İSKELETİ
        ===================================================== */

        function drawHeartGlow(
            heartbeatScale
        ) {

            const minDim =
                Math.min(
                    width,
                    height
                );


            const scale =
                minDim /
                (
                    width < 700
                        ? 35
                        : 33
                );


            const centerX =
                width / 2;


            const centerY =
                height / 2
                -
                (
                    width < 700
                        ? 15
                        : 35
                );


            /*
                Birkaç iç içe glow çizgisi
            */

            const layers = [
                {
                    radius: 1.08,
                    alpha: 0.08,
                    blur: 26,
                    width: 2.5
                },

                {
                    radius: 1.00,
                    alpha: 0.13,
                    blur: 18,
                    width: 1.3
                },

                {
                    radius: 0.92,
                    alpha: 0.06,
                    blur: 10,
                    width: 0.8
                }
            ];


            for (
                const layer of layers
            ) {

                ctx.save();


                ctx.beginPath();


                for (
                    let i = 0;
                    i <= 280;
                    i++
                ) {

                    const t =
                        (
                            i /
                            280
                        )
                        *
                        Math.PI *
                        2;


                    const p =
                        heartPoint(
                            t,
                            scale *
                            layer.radius *
                            heartbeatScale
                        );


                    const x =
                        centerX +
                        p.x;


                    const y =
                        centerY +
                        p.y;


                    if (
                        i === 0
                    ) {

                        ctx.moveTo(
                            x,
                            y
                        );

                    }
                    else {

                        ctx.lineTo(
                            x,
                            y
                        );

                    }

                }


                ctx.closePath();


                ctx.strokeStyle =
                    `rgba(
                        255,
                        23,
                        79,
                        ${layer.alpha}
                    )`;


                ctx.lineWidth =
                    layer.width;


                ctx.shadowBlur =
                    layer.blur;


                ctx.shadowColor =
                    "#ff0048";


                ctx.stroke();


                ctx.restore();

            }

        }


        /* =====================================================
           ARKA PLAN PARÇACIKLARI
        ===================================================== */

        let backgroundParticles = [];


        class BackgroundParticle {

            constructor() {

                this.reset();

                this.y =
                    Math.random() *
                    height;

            }


            reset() {

                this.x =
                    Math.random() *
                    width;


                this.y =
                    height +
                    Math.random() *
                    50;


                this.radius =
                    Math.random() *
                    1.8 +
                    0.4;


                this.speed =
                    4 +
                    Math.random() *
                    13;


                this.alpha =
                    Math.random() *
                    0.5 +
                    0.08;


                this.drift =
                    (
                        Math.random() -
                        0.5
                    )
                    * 5;

            }


            update(delta) {

                this.y -=
                    this.speed *
                    delta;


                this.x +=
                    this.drift *
                    delta;


                if (
                    this.y < -10
                ) {

                    this.reset();

                }

            }


            draw() {

                ctx.save();


                ctx.globalAlpha =
                    this.alpha;


                ctx.fillStyle =
                    "#ff174f";


                ctx.shadowBlur =
                    9;


                ctx.shadowColor =
                    "#ff174f";


                ctx.beginPath();


                ctx.arc(
                    this.x,
                    this.y,
                    this.radius,
                    0,
                    Math.PI * 2
                );


                ctx.fill();


                ctx.restore();

            }

        }


        function createBackgroundParticles() {

            backgroundParticles = [];


            const count =
                width < 700
                    ? 35
                    : 70;


            for (
                let i = 0;
                i < count;
                i++
            ) {

                backgroundParticles.push(
                    new BackgroundParticle()
                );

            }

        }


        createBackgroundParticles();


        /* =====================================================
           IŞIK PARLAMALARI
        ===================================================== */

        function drawCenterGlow(
            heartbeatScale
        ) {

            const centerX =
                width / 2;


            const centerY =
                height / 2 -
                40;


            const radius =
                Math.min(
                    width,
                    height
                )
                *
                0.34
                *
                heartbeatScale;


            const gradient =
                ctx.createRadialGradient(
                    centerX,
                    centerY,
                    0,
                    centerX,
                    centerY,
                    radius
                );


            gradient.addColorStop(
                0,
                "rgba(255, 0, 70, 0.095)"
            );


            gradient.addColorStop(
                0.45,
                "rgba(255, 0, 70, 0.035)"
            );


            gradient.addColorStop(
                1,
                "rgba(255, 0, 70, 0)"
            );


            ctx.save();


            ctx.fillStyle =
                gradient;


            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            ctx.restore();

        }


        /* =====================================================
           ANİMASYON
        ===================================================== */

        let lastTime =
            performance.now();


        function animate(
            now
        ) {

            const delta =
                Math.min(
                    (
                        now -
                        lastTime
                    )
                    /
                    1000,
                    0.035
                );


            lastTime =
                now;


            /*
                Tamamen temizliyoruz.
                Önceki sürümdeki aşırı ghosting
                burada yok.
            */

            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            const seconds =
                now /
                1000;


            const heartbeatScale =
                getHeartbeat(
                    seconds
                );


            /*
                Arka plan
            */

            drawCenterGlow(
                heartbeatScale
            );


            for (
                const particle
                of backgroundParticles
            ) {

                particle.update(
                    delta
                );


                particle.draw();

            }


            /*
                Kalp neon iskeleti
            */

            drawHeartGlow(
                heartbeatScale
            );


            /*
                İçeri akan kelimeler
            */

            for (
                const particle
                of wordParticles
            ) {

                particle.update(
                    delta
                );


                particle.draw(
                    heartbeatScale
                );

            }


            requestAnimationFrame(
                animate
            );

        }


        requestAnimationFrame(
            animate
        );


        /* =====================================================
           SAYFA BAŞLIĞI
        ===================================================== */

        document
            .getElementById(
                "mainName"
            )
            .textContent =
            CONFIG.mainName;

    </script>

</body>
